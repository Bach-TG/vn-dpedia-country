# Exact, normalized-key aliases only. Compare with reference_infobox_keys.csv
# before extending; never map a merely similar but semantically uncertain key.
capital:
  type: resource_list
  aliases: [capital, capital_city, thủ_đô, thu_do]
population_total:
  type: integer
  aliases: [population_estimate, population_census, population_total, population, dân_số, dan_so, dân_số_tổng_cộng]
  # Prefer a nonblank estimate; only fall back to census when estimate is absent
  # or blank. An ambiguous nonblank estimate never silently falls back to census.
  source_priority:
    - {source_type: estimate, aliases: [population_estimate], year_aliases: [population_estimate_year]}
    - {source_type: census, aliases: [population_census], year_aliases: [population_census_year]}
    - {source_type: generic_total, aliases: [population_total, population, dân_số, dan_so, dân_số_tổng_cộng], year_aliases: []}
area_km2:
  type: area_km2
  # The normalizer accepts Vietnamese three-digit grouping (41.285 -> 41285)
  # and genuine decimals (744.3); unclear units/formats stay unparsed.
  aliases: [area_km2, area_total_km2, area_total, diện_tích, dien_tich]
  # Only an unambiguous, independently recorded square-mile parameter may
  # decide whether a single three-digit group is decimal or thousands.
  crosscheck_sq_mi_aliases: [area_sq_mi, area_total_sq_mi]
currencies:
  type: resource_list
  aliases: [currency, currencies, tiền_tệ, tien_te]
official_languages:
  type: resource_list
  # recognised_national_languages is NOT an alias: recognised != official.
  aliases: [official_languages, official_language, ngôn_ngữ_chính_thức, ngon_ngu_chinh_thuc]
  contextual_fallback:
    value_aliases: [languages]
    type_aliases: [languages_type]
    required_semantics: official
calling_codes:
  type: string_list
  aliases: [calling_code, calling_codes, mã_điện_thoại, ma_dien_thoai]
